<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeTasks Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <h1>TypeTasks Tracker</h1>

    <!-- Input row for adding new tasks -->
    <div class="addrow">
      <input type="text" id="title" placeholder="Add a new task..." />
      <button id="add">Add Task</button>
    </div>

    <!-- Filter chips section to filter by status -->
    <div id="chips" class="chips-container">
      <button class="chip active" data-status="all">All</button>
      <button class="chip" data-status="todo">Todo</button>
      <button class="chip" data-status="in-progress">In-Progress</button>
      <button class="chip" data-status="done">Done</button>
    </div>

    <!-- Container for task count summary -->
    <div id="summary" class="summary"></div>

    <!-- Task list container -->
    <ul id="list" class="task-list"></ul>
  </div>

  <!-- 
    Load the COMPILED JavaScript output (app.js) as an ES Module 
    so browser module imports (import ... from './model.js') work properly.
  -->
  <script type="module" src="app.js"></script>
</body>
</html>
